<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONTACT — FALKOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="inner-page">

  <nav id="nav">
    <a href="/" class="nav-logo">FALKOR</a>
    <div class="nav-separator">·</div>
    <div class="nav-links">
      <a href="/portfolio.html" class="nav-link">PORTFOLIO</a>
      <span class="nav-dot">·</span>
      <a href="/about.html" class="nav-link">ABOUT</a>
      <span class="nav-dot">·</span>
      <a href="/contact.html" class="nav-link active">CONTACT</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu">&#9776;</button>
  </nav>

  <div id="mobile-nav" class="hidden">
    <button id="mobile-nav-close">&#10005;</button>
    <div class="mobile-nav-links">
      <a href="/portfolio.html">PORTFOLIO</a>
      <a href="/about.html">ABOUT</a>
      <a href="/contact.html">CONTACT</a>
    </div>
  </div>

  <main class="contact-main">
    <div class="contact-content">
      <div class="contact-instruction">
        <p>FOR WORK ENQUIRIES AND COLLABORATIONS</p>
      </div>

      <form class="contact-form" id="contact-form" onsubmit="submitForm(event)">
        <div class="form-field">
          <input type="text" id="contact-name" placeholder="NAME" required autocomplete="name" />
        </div>
        <div class="form-field">
          <input type="email" id="contact-email" placeholder="EMAIL" required autocomplete="email" />
        </div>
        <div class="form-field">
          <textarea id="contact-message" placeholder="MESSAGE" rows="5" required></textarea>
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">SEND &nbsp;&#8594;</button>
        <p class="form-status hidden" id="form-status"></p>
      </form>

      <div class="contact-direct">
        <p>OR DM ON INSTAGRAM: <a href="https://www.instagram.com/falkor_ae/" target="_blank" rel="noopener">@FALKOR_AE</a></p>
      </div>
    </div>
  </main>

  <footer id="footer">
    <span class="footer-text">FALKOR · TOKYO · 2026</span>
    <a href="/admin.html" class="admin-link">ADMIN</a>
  </footer>

  <script>
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('mobile-nav').classList.remove('hidden');
    });
    document.getElementById('mobile-nav-close').addEventListener('click', () => {
      document.getElementById('mobile-nav').classList.add('hidden');
    });

    async function submitForm(e) {
      e.preventDefault();
      const btn    = document.getElementById('submit-btn');
      const status = document.getElementById('form-status');

      const name    = document.getElementById('contact-name').value.trim();
      const email   = document.getElementById('contact-email').value.trim();
      const message = document.getElementById('contact-message').value.trim();

      btn.disabled   = true;
      btn.textContent = 'SENDING…';
      status.classList.add('hidden');

      try {
        const res  = await fetch('/api/contact', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ name, email, message }),
        });
        const data = await res.json();

        if (res.ok) {
          status.textContent = 'MESSAGE SENT.';
          status.style.color = '';
          e.target.reset();
        } else {
          status.textContent = data.error || 'SOMETHING WENT WRONG. PLEASE TRY AGAIN.';
          status.style.color = '#ff6b6b';
        }
      } catch {
        status.textContent = 'NETWORK ERROR. PLEASE TRY AGAIN.';
        status.style.color = '#ff6b6b';
      }

      status.classList.remove('hidden');
      btn.disabled    = false;
      btn.textContent = 'SEND  →';
    }
  </script>
</body>
</html>
