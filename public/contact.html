<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONTACT — FALKOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="inner-page">

  <nav id="nav">
    <a href="/" class="nav-logo">FALKOR</a>
    <div class="nav-separator">·</div>
    <div class="nav-links">
      <a href="/portfolio.html" class="nav-link">PORTFOLIO</a>
      <span class="nav-dot">·</span>
      <a href="/about.html" class="nav-link">ABOUT</a>
      <span class="nav-dot">·</span>
      <a href="/contact.html" class="nav-link active">CONTACT</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu">&#9776;</button>
  </nav>

  <div id="mobile-nav" class="hidden">
    <button id="mobile-nav-close">&#10005;</button>
    <div class="mobile-nav-links">
      <a href="/portfolio.html">PORTFOLIO</a>
      <a href="/about.html">ABOUT</a>
      <a href="/contact.html">CONTACT</a>
    </div>
  </div>

  <main class="contact-main">
    <div class="contact-content">
      <div class="contact-instruction">
        <p>FOR WORK ENQUIRIES AND COLLABORATIONS</p>
      </div>

      <div class="contact-direct">
        <p>DM ON INSTAGRAM: <a href="https://www.instagram.com/falkor_ae/" target="_blank" rel="noopener">@FALKOR_AE</a></p>
      </div>
    </div>
  </main>

  <footer id="footer">
    <span class="footer-text">FALKOR · TOKYO · 2026</span>
    <a href="/admin.html" class="admin-link">ADMIN</a>
  </footer>

  <script>
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('mobile-nav').classList.remove('hidden');
    });
    document.getElementById('mobile-nav-close').addEventListener('click', () => {
      document.getElementById('mobile-nav').classList.add('hidden');
    });

    function submitForm(e) {
      e.preventDefault();
      const status = document.getElementById('form-status');
      status.textContent = 'MESSAGE SENT.';
      status.classList.remove('hidden');
      e.target.reset();
      setTimeout(() => status.classList.add('hidden'), 4000);
    }
  </script>
</body>
</html>
