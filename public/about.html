  <script>
    document.getElementById('hamburger').addEventListener('click', () => {

    document.getElementById('mobile-nav-close').addEventListener('click', () => {
      document.getElementById('mobile-nav').classList.add('hidden');
    });

    // Calculate day number from project start (update this date)
    const projectStart = new Date('2026-01-01');
    const today = new Date();
    const dayNum = Math.min(100, Math.floor((today - projectStart) / (1000 * 60 * 60 * 24)) + 1);
    if (dayNum > 0 && dayNum <= 100) {
      document.getElementById('day-counter').textContent =
        `CURRENTLY: 100 DAYS. DAY ${dayNum}/100.`;
